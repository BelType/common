# A tag <dir>-vX.Y.Z (common-v0.1.3) publishes packages/<dir> to npm with the NPM_TOKEN secret of this repository (a granular token limited to these packages, 90 days), with provenance.
# The house style: codeberg.org/BelType/decisions, project/a-release-moves-three-remotes-at-once.md.
# ponytail: the tests are not run here; they run on the machine before the tag is pushed. Add a test step when a release ever goes out untested.
name: release
on:
  push:
    tags: ['*-v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag, package.json and the CHANGELOG name one version
        run: |
          dir="${GITHUB_REF_NAME%-v*}"; v="${GITHUB_REF_NAME##*-v}"
          test -f "packages/$dir/package.json" || { echo "::error::the tag names packages/$dir, which has no package.json"; exit 1; }
          test "$(node -p "Boolean(require('./packages/$dir/package.json').private)")" = false || { echo "::error::packages/$dir is private and is never published"; exit 1; }
          test "$(node -p "require('./packages/$dir/package.json').version")" = "$v" || { echo "::error::packages/$dir/package.json does not say $v"; exit 1; }
          grep -q "^## $v " "packages/$dir/CHANGELOG.md" || { echo "::error::packages/$dir/CHANGELOG.md has no heading for $v"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Publish, unless this version is on npm already (a package's first version is published by hand)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "packages/$dir"
          at="$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME##*-v}"
          if npm view "$at" version >/dev/null 2>&1; then echo "$at is on npm already"; else npm publish --provenance --access public; fi
